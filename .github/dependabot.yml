version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    # This project is on react-scripts 5.0.1, which is EOL upstream. Version
    # bumps here mostly cannot be resolved without leaving CRA, so routine
    # update PRs are noise. open-pull-requests-limit: 0 disables version
    # updates while leaving Dependabot security updates enabled, since those
    # are not governed by this limit.
    open-pull-requests-limit: 0
    labels:
      - dependencies
